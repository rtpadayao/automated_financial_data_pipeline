version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: postgres_demo
    env_file: .env
    ports:
      - "5432:5432"
    volumes:
      - ./postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - demo_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin_demo
    env_file: .env
    ports:
      - "8080:80"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - demo_net

  flaskapi:
    build: ./flaskapi
    container_name: flask_api
    ports:
      - "5000:5000"
    restart: unless-stopped
    networks:
      - demo_net

  airflow:
    image: apache/airflow:2.8.1
    container_name: airflow_demo
    env_file: .env
    environment:
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - AIRFLOW__CORE__SQL_ALCHEMY_CONN=postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    volumes:
      - ./dags:/opt/airflow/dags
      - ./airflow_logs:/opt/airflow/logs
      - ./dbt:/opt/dbt
    ports:
      - "8081:8080"
    depends_on:
      postgres:
        condition: service_healthy
      flaskapi:
        condition: service_started
    restart: unless-stopped
    networks:
      - demo_net

  dbt:
    image: ghcr.io/dbt-labs/dbt-postgres:latest
    container_name: dbt_demo
    volumes:
      - ./dbt:/usr/app
    env_file: .env
    working_dir: /usr/app
    environment:
      DBT_PROFILES_DIR: /usr/app
    command: ["run"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - demo_net

networks:
  demo_net:
    driver: bridge
